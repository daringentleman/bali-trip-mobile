<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bali Trip">
<meta name="theme-color" content="#d8c4c4">
<link rel="apple-touch-icon" sizes="180x180" href="/ios27/bali-touch.png">
<link rel="apple-touch-icon-precomposed" sizes="180x180" href="/ios27/bali-touch.png">
<title>Bali Trip</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:linear-gradient(145deg,#f8f1ed,#e9edf4);color:#211d1e}body{display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(360px,100%);text-align:center;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9);border-radius:28px;padding:26px 20px;box-shadow:0 18px 50px rgba(80,65,75,.13);backdrop-filter:blur(18px)}img{width:144px;height:144px;border-radius:30px;display:block;margin:0 auto 18px;object-fit:cover;box-shadow:0 10px 30px rgba(60,45,50,.16);background:#ddd}h1{margin:0 0 10px;font-size:30px}p{margin:0;color:#6e666a;font-size:16px;line-height:1.55}.ok{margin-top:18px;font-weight:700;color:#40373b}
</style>
<script>
(function(){
  var standalone=(window.navigator.standalone===true)||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
  if(standalone){ location.replace('/index.html'); }
})();
</script>
</head>
<body>
<div class="box">
  <img src="/ios27/bali-touch.png" alt="Bali Trip App icon">
  <h1>Bali Trip</h1>
  <p>這個頁面只用來加入 iPhone 主畫面。</p>
  <p class="ok">看到上面的 BALI 沙灘圖後，按 Safari 分享 →「加入主畫面」。</p>
</div>
</body>
</html>
