<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>修復峇里島 App</title><style>html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(135deg,#f4ece3,#ddd9e6);color:#211d25}main{height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}.box{width:min(360px,100%);padding:24px;border-radius:26px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.8);box-shadow:0 20px 60px rgba(40,30,50,.16);text-align:center;backdrop-filter:blur(22px)}h1{font-size:22px;margin:0 0 10px}p{font-size:13px;line-height:1.6;color:#6f6a73;margin:0}.spin{width:28px;height:28px;border:3px solid rgba(120,110,130,.2);border-top-color:#8d6bff;border-radius:50%;margin:18px auto 0;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style><main><div class="box"><h1>正在修復 App</h1><p id="msg">清除舊版快取並重新載入穩定版本…</p><div class="spin"></div></div></main><script>(async()=>{const msg=document.getElementById('msg');try{if('serviceWorker'in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if('caches'in window){const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}localStorage.setItem('bali_recovery_164',String(Date.now()));if('serviceWorker'in navigator){msg.textContent='安裝穩定版本…';const reg=await navigator.serviceWorker.register('/sw.js?recovery=164',{scope:'/'});await reg.update().catch(()=>{});await new Promise(resolve=>{let done=false;const finish=()=>{if(done)return;done=true;resolve()};navigator.serviceWorker.addEventListener('controllerchange',finish,{once:true});setTimeout(finish,2200)})}msg.textContent='完成，正在重新開啟…';location.replace('/?recovered=164&t='+Date.now())}catch(e){msg.textContent='修復已清除舊快取，正在重新開啟…';setTimeout(()=>location.replace('/?recovered=164&t='+Date.now()),700)}})();</script>
